# Self-hosted deployment. Reaches Open WebUI over the local Docker network, so
# the inference call never leaves the host — no Cloudflare hop, no Access
# service token needed (see "Deployments" in docs/ARCHITECTURE.md).
#
# Run it with:
#   docker compose --env-file .env.local up -d --build
#
# The --env-file matters: Compose substitutes ${...} below from the shell or a
# `.env` file, NOT from the `env_file:` key (which only sets container runtime
# vars). Without it the client ID resolves to "" and gets baked into the browser
# bundle empty, silently disabling client-side flags. The `:?` guard below turns
# that into a startup error instead of a mystery.

services:
  nimbus:
    build:
      context: .
      args:
        # Build-time, not runtime — NEXT_PUBLIC_* is inlined by `next build`.
        NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_ID: "${NEXT_PUBLIC_LAUNCHDARKLY_CLIENT_ID:?missing - rerun with --env-file .env.local}"
    env_file: .env.local
    environment:
      # Auth.js only auto-trusts the request host on Vercel; behind a tunnel or
      # reverse proxy it has to be told explicitly, or logins fail on callback.
      AUTH_TRUST_HOST: "true"
      # Open WebUI on the shared network below — not the public tunnel hostname.
      LOCAL_AI_BASE_URL: http://open-webui:8080/api
      # Blank: the Access service token is only for the public hostname.
      CF_ACCESS_CLIENT_ID: ""
      CF_ACCESS_CLIENT_SECRET: ""
    # Loopback only — the host is reachable from the internet solely through
    # the Cloudflare Tunnel, same as every other service here.
    ports:
      - "127.0.0.1:3200:3000"
    restart: unless-stopped
    networks:
      - openwebui

networks:
  # The network Open WebUI already runs on, so it's reachable by container
  # name. Confirm with `docker inspect open-webui` if this ever moves.
  openwebui:
    external: true
    name: local-ai_default
